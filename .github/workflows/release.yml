name: Signed Android Release

on:
  push:
    branches: [feature/release-completion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      EXPECTED_CERT_SHA256: b3edd0bc6edfc8573376fdbadda6358d37dd1ccd9fd2a3c09eb4ae97023cc187
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate signing secrets and keystore certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export LC_ALL=C
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/release-validation.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          BASE64_CLEAN="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"
          test -n "$BASE64_CLEAN"
          printf '%s' "$BASE64_CLEAN" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          if ! KEY_LIST="$(keytool -list -v -keystore "$KEYSTORE" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD 2>&1)"; then
            echo "::error::Keystore validation failed. Check the Base64 value and store password; sensitive diagnostic output was suppressed."
            exit 1
          fi

          DETECTED_ALIAS="$(printf '%s\n' "$KEY_LIST" | awk '
            /^[[:space:]]*Alias name: / {
              alias = $0
              sub(/^[[:space:]]*Alias name: /, "", alias)
              sub(/[[:space:]]+$/, "", alias)
            }
            /^[[:space:]]*Entry type: PrivateKeyEntry[[:space:]]*$/ {
              if (alias != "") print alias
              alias = ""
            }
          ')"
          ALIAS_COUNT="$(printf '%s\n' "$DETECTED_ALIAS" | awk 'NF {count++} END {print count+0}')"
          if [ "$ALIAS_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one PrivateKeyEntry in the release keystore; found $ALIAS_COUNT. Refusing to guess the signing key."
            exit 1
          fi

          printf 'ANDROID_KEY_ALIAS=%s\n' "$DETECTED_ALIAS" >> "$GITHUB_ENV"
          if ! CERT_OUTPUT="$(keytool -list -v -keystore "$KEYSTORE" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$DETECTED_ALIAS" 2>&1)"; then
            echo "::error::Detected private-key alias could not be inspected; sensitive diagnostic output was suppressed."
            exit 1
          fi
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$CERT_OUTPUT" | awk -F': ' '/SHA256:/ {gsub(/:/, "", $2); print tolower($2); exit}')"
          if [ -z "$ACTUAL_CERT_SHA256" ] || [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Keystore certificate fingerprint mismatch. Expected $EXPECTED_CERT_SHA256, received ${ACTUAL_CERT_SHA256:-empty}."
            exit 1
          fi
          echo "Keystore contains exactly one private-key entry and its certificate fingerprint matches."

      - name: Build signed APK and Android App Bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon -PrequireReleaseSigning=true :app:lintRelease :app:assembleRelease :app:bundleRelease

      - name: Verify APK package, signature and certificate fingerprint
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          PACKAGE="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          test "$PACKAGE" = "com.preechaphukthaisong65.universalvideoplayer"
          ACTUAL_CERT_SHA256="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {gsub(/:/, "", $2); print tolower($2); exit}')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

      - name: Verify Android App Bundle signature and certificate fingerprint
        run: |
          set -euo pipefail
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)"
          test -n "$AAB"
          VERIFY_OUTPUT="$(jarsigner -verify -verbose -certs "$AAB" 2>&1)"
          printf '%s\n' "$VERIFY_OUTPUT" | grep -qi 'jar verified'
          AAB_CERT_OUTPUT="$(keytool -printcert -jarfile "$AAB")"
          AAB_CERT_SHA256="$(printf '%s\n' "$AAB_CERT_OUTPUT" | awk -F': ' '/SHA256:/ {gsub(/:/, "", $2); print tolower($2); exit}')"
          test -n "$AAB_CERT_SHA256"
          test "$AAB_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

      - name: Generate release checksums
        run: |
          set -euo pipefail
          find app/build/outputs/apk/release app/build/outputs/bundle/release -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | sort -z | xargs -0 sha256sum > app/build/outputs/release-SHA256SUMS.txt
          test -s app/build/outputs/release-SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: universal-video-player-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/release-SHA256SUMS.txt
          if-no-files-found: error
